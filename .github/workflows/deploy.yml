name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # main keeps the documented `pages` group; PRs get their own per-PR group
  # so PR checks can never cancel or collide with production deploys.
  group: ${{ github.event_name == 'pull_request' && format('pr-checks-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node QA suite (structure + logic + privacy)
        run: node tests/verify.mjs
      - name: Privacy negative fixtures (gate must fail on violations)
        run: node tests/privacy-negative.mjs
      - name: HTML sanity checks
        run: |
          set -e
          fail=0
          # every tool page must parse its JSON-LD and reference the shared engine
          for f in tools/*/index.html; do
            grep -q 'class="tb-tool"' "$f" || { echo "MISSING tb-tool JSON-LD: $f"; fail=1; }
            grep -q 'assets/js/app.js' "$f" || { echo "MISSING app.js include: $f"; fail=1; }
            grep -q 'data-tb="copy-btn"' "$f" || { echo "MISSING copy-btn: $f"; fail=1; }
            grep -q 'data-tb="clear-btn"' "$f" || { echo "MISSING clear-btn: $f"; fail=1; }
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8').match(/<script type=\"application\/ld\+json\" class=\"tb-tool\">([\s\S]*?)<\/script>/)[1])" || { echo "BAD JSON-LD: $f"; fail=1; }
          done
          # belt-and-braces privacy grep (Node suite is authoritative): any
          # http(s)/protocol-relative src on script/img/iframe/link/source/track
          # or an object data attribute, in any quote style or letter case.
          if grep -nEi '<(script|img|iframe|source|track|embed)[^>]*\ssrc\s*=\s*("|\x27)?(https?:)?//|<object[^>]*\sdata\s*=\s*("|\x27)?(https?:)?//' index.html 404.html tools/*/index.html; then
            echo "NON-SAME-ORIGIN RESOURCE REFERENCE FOUND (privacy regression)"; fail=1
          fi
          # homepage registry, sitemap, and footer must agree on the tool list
          node -e "
            const fs = require('fs');
            const reg = fs.readFileSync('assets/js/app.js','utf8').match(/TOOLBOTS_TOOLS = \[([\s\S]*?)\];/)[1];
            const paths = [...reg.matchAll(/path: '([^']+)'/g)].map(m => m[1]);
            const sm = fs.readFileSync('sitemap.xml','utf8');
            const idx = fs.readFileSync('index.html','utf8');
            for (const p of paths) {
              if (!fs.existsSync(p + 'index.html')) { console.error('registry path missing on disk: ' + p); process.exit(1); }
              if (!sm.includes('toolbots.xyz/' + p)) { console.error('sitemap missing: ' + p); process.exit(1); }
            }
            const foot = idx.match(/<nav class=\"footer-col\" aria-label=\"Tools\">([\s\S]*?)<\/nav>/)[1];
            for (const p of paths) if (!foot.includes('href=\"/' + p + '\"')) { console.error('footer missing: ' + p); process.exit(1); }
            console.log('registry/sitemap/footer consistent:', paths.length, 'tools');
          "
          [ $fail -eq 0 ] && echo "All checks passed." || exit 1
  deploy:
    needs: check
    # Deploy ONLY production: main push or manual run against main.
    # PR runs execute check-only — they can never deploy.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Exclude non-site files from artifact
        run: rm -rf tests docs *.md LICENSE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
